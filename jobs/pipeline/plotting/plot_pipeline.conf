# plot_pipeline.conf — default settings for the plotting stage.
#
# This is the DEFAULT, tracked in the util checkout and used by every run that
# does not override it. To make one analysis directory's figures differ, copy
# this file into that directory as plot_pipeline.conf and edit it there:
# plot_pipeline.sh reads the run directory's copy first and this one only as the
# fallback, so nothing in tracked code has to change for a one-off.
#
# Unlike submit_pipeline.conf, this file holds no personal paths, so it is
# tracked rather than gitignored — it is a working default, not an example.
#
# Every key may be left empty, which leaves plot_distributions.py's own default
# in effect. Comments first, then the variables, matching submit_pipeline.conf.
#
# -----------------------------------------------------------------------------
# What gets drawn
# -----------------------------------------------------------------------------
# One PNG per quantity, into <date>_<calc>/ beside the CSV it came from. The
# date is taken FROM THE CSV, not from today, so figures stay married to the
# data that produced them and re-plotting an old run does not restamp it.
#
# No reference lines are drawn on any individual plot — no g(r) = 1 line, no
# baseline under T(r). The asymptotic limit each convention column should
# approach is printed by rdf_freud.py's convention table instead, which is the
# check that actually catches a wrong normalization.
#
#   PLOT_STYLE       'analysis' (default) — titled, fully labelled, y ticks; for
#                    reading a run. 'publication' — heavy lines and spines,
#                    large bold labels, no y ticks; for dropping a single curve
#                    into a document. This is what the old rdf_freud_plot.py and
#                    bad_freud_plot.py second pass produced, and it now applies
#                    to all six calculations rather than two.
#   PLOT_COMPOSITES  1 (default) also writes the composite figures — the ones
#                    where the combination is itself the result: the Wright
#                    overlay, the mode-character decomposition, and the
#                    per-species overlays. 0 writes only individual curves.
#   PLOT_DATE        Which run to plot when a directory holds several:
#                    'latest' (default), 'all', or an explicit YYYYMMDD.
#   PLOT_FORMAT      png (default), pdf, svg — anything matplotlib can write.
#   PLOT_DPI         Raster resolution; ignored for pdf/svg. Default 150.
#   PLOT_FREQ_UNIT   x axis for vdos and vdos_dynmat: meV (default) | THz |
#                    cm-1 | eV. The CSVs carry all four, so this only chooses
#                    which column becomes the axis — no recomputation.
#   PLOT_HEATMAP_CMAP  Colormap for the S(q,w) heatmaps. Default inferno.
#   PLOT_PYTHON      Interpreter to run plot_distributions.py with. Leave empty
#                    for whatever `python` resolves to, which on the cluster
#                    means the venv the analysis job already activated.
#
# -----------------------------------------------------------------------------
# Which calculations to plot
# -----------------------------------------------------------------------------
# 1 plots that calculation when its CSVs are present, 0 skips it. A calculation
# whose CSVs are absent is skipped silently either way — these are for turning
# off something that IS there, e.g. re-plotting only the rdf after changing its
# style, without rewriting every other figure in the directory.
#
#   PLOT_RDF           rdfs.csv, nrs.csv, wright.csv  -> <date>_rdf/
#   PLOT_BAD           bads.csv                       -> <date>_bad/
#   PLOT_DSF           sq.csv, dsf.csv                -> <date>_dsf/
#   PLOT_VDOS          vdos.csv                       -> <date>_vdos/
#   PLOT_MSD           msd.csv                        -> <date>_msd/
#   PLOT_VDOS_DYNMAT   vdos_dynmat.csv and its modes  -> <date>_vdos_dynmat/
# -----------------------------------------------------------------------------

PLOT_STYLE="analysis"
PLOT_COMPOSITES="1"
PLOT_DATE="latest"
PLOT_FORMAT="png"
PLOT_DPI="150"
PLOT_FREQ_UNIT="meV"
PLOT_HEATMAP_CMAP="inferno"
PLOT_PYTHON=""

PLOT_RDF="1"
PLOT_BAD="1"
PLOT_DSF="1"
PLOT_VDOS="1"
PLOT_MSD="1"
PLOT_VDOS_DYNMAT="1"
